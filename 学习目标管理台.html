<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="目标台">
<meta name="theme-color" content="#7c5cff">
<title>学习目标管理台</title>
<!-- 本工作台为单文件离线应用：无外部接口、无 CDN、无第三方库，所有 CSS/JS/图标/图表内联 -->
<style>
:root{
  --bg:#f5f7fc; --card:#ffffff; --text:#1b2033; --muted:#6c7386; --line:#e8ebf4;
  --p1:#7c5cff; --p2:#a78bfa; --soft:#f1eeff;
  --grad:linear-gradient(135deg,#7c5cff 0%,#a78bfa 100%);
  --green:#16a34a; --green-soft:#e8f7ee;
  --red:#e5484d; --red-soft:#fdeded;
  --amber:#f59e0b; --amber-soft:#fff5e3;
  --radius:16px; --radius-sm:10px;
  --shadow:0 2px 10px rgba(28,32,60,.06);
  --shadow-lg:0 12px 40px rgba(28,32,60,.16);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,p{margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit}
.hidden{display:none !important}

/* ---------- 布局骨架 ---------- */
.app{display:flex;min-height:100vh}
.sidebar{display:none}
.main-col{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;background:rgba(246,248,253,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding:10px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;letter-spacing:.3px}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.topbar .spacer{flex:1}
.date-chip{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 11px}
.top-nav{display:none}
.content{padding:14px 14px calc(84px + env(safe-area-inset-bottom));max-width:1220px;margin:0 auto;width:100%}
.panel{display:flex;flex-direction:column;gap:4px}

/* ---------- 侧边栏 / 导航 ---------- */
.navbtn{display:flex;align-items:center;gap:10px;color:var(--muted);border-radius:12px;transition:background .15s,color .15s}
.navbtn svg{flex:none}
.navbtn.on{color:var(--p1);font-weight:700}
.side-nav{display:flex;flex-direction:column;gap:4px;margin-top:18px}
.side-nav .navbtn{padding:11px 12px;font-size:15px;width:100%}
.side-nav .navbtn.on{background:var(--soft)}
.side-nav .navbtn:hover{background:#f4f5fa}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;line-height:1.7}
.top-nav{display:none;gap:4px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px}
.top-nav .navbtn{padding:7px 14px;font-size:14px;border-radius:999px}
.top-nav .navbtn.on{background:var(--soft)}
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  background:rgba(255,255,255,.97);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 12px rgba(28,32,60,.05);
}
.tabbar .navbtn{flex:1;flex-direction:column;gap:3px;min-height:56px;padding:7px 0 6px;font-size:11px;justify-content:center}
.tabbar .navbtn.on{color:var(--p1)}

/* ---------- 通用组件 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow)}
.sec-title{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;margin:20px 2px 10px}
.sec-title .sub{font-weight:500;font-size:12.5px;color:var(--muted)}
.sec-title .spacer{flex:1}
.grid{display:grid;gap:13px;grid-template-columns:1fr}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:44px;padding:0 16px;border-radius:12px;font-weight:700;font-size:14.5px;
  background:#f1f2f8;color:var(--text);border:1px solid var(--line);transition:transform .08s,filter .15s;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--grad);color:#fff;border:none;box-shadow:0 4px 14px rgba(124,92,255,.28)}
.btn.green{background:var(--green);color:#fff;border:none}
.btn.danger{background:var(--red-soft);color:var(--red);border-color:#f7d4d5}
.btn.ghost{background:#fff}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:10px;font-weight:600}
.btn.block{width:100%}
.btn.big{min-height:52px;font-size:16px;border-radius:14px}
.btn:disabled{opacity:.45}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field .hint{font-size:12px;color:var(--muted);font-weight:400}
input[type=text],input[type=number],input[type=date],select,textarea{
  font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);
  background:#fff;color:var(--text);width:100%;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--p1);box-shadow:0 0 0 3px rgba(124,92,255,.13)}
textarea{resize:vertical;min-height:70px;line-height:1.5}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:#f1f2f8;color:var(--muted)}
.chip.p{background:var(--soft);color:var(--p1)}
.chip.g{background:var(--green-soft);color:var(--green)}
.chip.r{background:var(--red-soft);color:var(--red)}
.chip.a{background:var(--amber-soft);color:#b76e00}
.muted{color:var(--muted)}
.tiny{font-size:12.5px}
.small{font-size:13.5px}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.spacer{flex:1}
.empty{text-align:center;padding:34px 16px;color:var(--muted);font-size:14px}
.empty svg{opacity:.5;margin-bottom:8px}

/* ---------- 备份横幅 ---------- */
.banner{
  display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:14px;
  background:linear-gradient(135deg,#f3f0ff,#eef4ff);border:1px solid #e2dbff;
  color:#4b3fa8;font-size:13.5px;font-weight:600;margin:12px 0 2px;
}
.banner .btn{min-height:38px}
.banner .ico{width:34px;height:34px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--p1);flex:none}

/* ---------- 今日要处理 ---------- */
.today-box{border-radius:var(--radius);padding:15px;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow)}
.today-box .head{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16.5px;margin-bottom:12px}
.alert{border-radius:13px;padding:12px 13px;margin-bottom:10px;border:1px solid}
.alert.r{background:var(--red-soft);border-color:#f8d3d4;color:#a3282c}
.alert.a{background:var(--amber-soft);border-color:#f6e0b8;color:#8a5a00}
.alert.g{background:var(--green-soft);border-color:#c9ecd7;color:#12693a}
.alert.n{background:#f4f5fa;border-color:var(--line);color:var(--text)}
.alert .t{font-weight:800;font-size:14.5px;display:flex;align-items:center;gap:7px}
.alert .d{font-size:13px;margin-top:3px;opacity:.92}
.alert .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.alert .btn{min-height:38px}

/* ---------- 目标卡 ---------- */
.goal-card{position:relative;overflow:hidden}
.goal-card .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
.goal-head{display:flex;align-items:flex-start;gap:10px}
.goal-name{font-weight:800;font-size:16px;line-height:1.35}
.goal-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.plan{margin-top:10px;background:#fafbff;border:1px dashed #dfe3f0;border-radius:12px;padding:10px 11px;font-size:13px;line-height:1.6}
.plan .k{font-weight:800;color:var(--p1);font-size:12px}
.plan .k.r{color:var(--red)}
.prog{margin-top:12px}
.prog .line{height:9px;border-radius:999px;background:#eef0f7;overflow:hidden}
.prog .fill{height:100%;border-radius:999px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.nums{display:flex;gap:0;margin-top:12px;border-top:1px solid var(--line);padding-top:11px}
.nums .n{flex:1;text-align:center;border-right:1px solid var(--line)}
.nums .n:last-child{border-right:none}
.nums .v{font-weight:800;font-size:15.5px;line-height:1.25}
.nums .l{font-size:11.5px;color:var(--muted);margin-top:2px}
.checkin{display:flex;align-items:center;gap:7px;margin-top:12px;flex-wrap:wrap}
.checkin .amt{width:88px;flex:none}
.checkin .min{width:104px;flex:none}
.checkin .dt{flex:1;min-width:120px}
.checkin .btn{flex:none}
.goal-acts{display:flex;gap:8px;margin-top:11px}

/* ---------- 看板 ---------- */
.ring-row{display:flex;gap:14px;align-items:center}
.ring{width:96px;height:96px;flex:none;position:relative}
.ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:19px}
.ring .pct small{font-size:10.5px;font-weight:600;color:var(--muted)}
.rec-list{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.rec{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed #eef0f7;font-size:13.5px}
.rec:last-child{border-bottom:none}
.rec .rd{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px;min-width:52px}
.rec .rv{font-weight:700}
.rec .spacer{flex:1}
.iconbtn{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--muted);background:#f4f5fa;flex:none}
.iconbtn.d{color:var(--red);background:var(--red-soft)}
.chart-box{margin-top:6px}
.chart-legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:9px;font-size:12.5px;color:var(--muted)}
.chart-legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}

/* ---------- 周报 ---------- */
.week-nav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.week-nav .ib{width:40px;height:40px;border-radius:11px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.week-nav .rng{flex:1;text-align:center;font-weight:800;font-size:15px}
.week-nav .rng small{display:block;font-weight:600;font-size:12px;color:var(--muted)}
.wtable{width:100%;border-collapse:collapse;font-size:13.5px}
.wtable th{text-align:right;font-size:12px;color:var(--muted);font-weight:700;padding:6px 4px;border-bottom:1px solid var(--line)}
.wtable th:first-child{text-align:left}
.wtable td{padding:9px 4px;border-bottom:1px solid #f0f2f8;text-align:right;font-variant-numeric:tabular-nums}
.wtable td:first-child{text-align:left;font-weight:700}
.wtable tr:last-child td{border-bottom:none}
.delta{font-size:12px;font-weight:700}
.delta.up{color:var(--green)}
.delta.down{color:var(--red)}
.delta.flat{color:var(--muted)}
.four{display:grid;gap:12px;grid-template-columns:1fr}
.report-out{white-space:pre-wrap;font-size:13px;line-height:1.75;background:#fbfcff;border:1px solid var(--line);border-radius:12px;padding:12px;max-height:340px;overflow:auto;font-variant-numeric:tabular-nums}

/* ---------- 我的 ---------- */
.me-item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #f0f2f8}
.me-item:last-child{border-bottom:none}
.me-item .ti{font-weight:700;font-size:14.5px}
.me-item .ds{font-size:12.5px;color:var(--muted);margin-top:2px}
.me-item .ico{width:38px;height:38px;border-radius:11px;background:var(--soft);color:var(--p1);display:flex;align-items:center;justify-content:center;flex:none}
.me-item .ico.g{background:var(--green-soft);color:var(--green)}
.me-item .ico.r{background:var(--red-soft);color:var(--red)}
.me-item .ico.a{background:var(--amber-soft);color:#b76e00}
.steps{counter-reset:s;margin-top:8px}
.steps li{list-style:none;position:relative;padding-left:30px;margin-bottom:10px;font-size:13.5px;line-height:1.6}
.steps li:before{
  counter-increment:s;content:counter(s);position:absolute;left:0;top:1px;width:21px;height:21px;
  border-radius:50%;background:var(--grad);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;
}
.danger-zone{border-color:#f6d8d9;background:#fffafa}

/* ---------- 弹窗 ---------- */
#modalRoot{position:fixed;inset:0;z-index:100;display:none}
#modalRoot.open{display:block}
.mask{position:absolute;inset:0;background:rgba(20,24,45,.42);backdrop-filter:blur(2px);animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;
  background:#fff;border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  box-shadow:var(--shadow-lg);animation:up .24s cubic-bezier(.2,.9,.2,1);
}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sheet-head h3{font-size:17px;font-weight:800}
.sheet-head .spacer{flex:1}
.sheet .foot{display:flex;gap:10px;margin-top:16px}
.sheet .foot .btn{flex:1}
.swatches{display:flex;gap:9px;flex-wrap:wrap}
.swatch{width:38px;height:38px;border-radius:11px;border:2px solid transparent;display:flex;align-items:center;justify-content:center;color:#fff}
.swatch.on{border-color:var(--text)}
.swatch.on svg{opacity:1}

/* ---------- 彩带 ---------- */
#confettiRoot{position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden}
.cf{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;animation:cfall linear forwards}
@keyframes cfall{
  0%{transform:translate3d(0,-20px,0) rotate(0deg);opacity:1}
  100%{transform:translate3d(var(--dx),102vh,0) rotate(720deg);opacity:.9}
}
.toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:150;
  background:rgba(27,32,51,.94);color:#fff;font-size:13.5px;font-weight:600;
  padding:11px 16px;border-radius:12px;box-shadow:var(--shadow-lg);animation:fade .2s ease;
}

/* ---------- 响应式 ---------- */
@media(min-width:768px){
  .tabbar{display:none}
  .top-nav{display:flex}
  .content{padding:16px 20px 44px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .four{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sheet{left:50%;top:50%;right:auto;bottom:auto;transform:translate(-50%,-50%);width:560px;max-height:86vh;border-radius:20px;animation:pop .2s cubic-bezier(.2,.9,.2,1)}
  @keyframes pop{from{transform:translate(-50%,-46%) scale(.97);opacity:.5}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
  .banner{margin:14px 0 0}
}
@media(min-width:1024px){
  .sidebar{
    display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:242px;
    background:#fff;border-right:1px solid var(--line);padding:20px 14px;z-index:30;
  }
  .main-col{margin-left:242px}
  .top-nav{display:none}
  .topbar{padding:12px 26px}
  .content{padding:18px 28px 60px}
  .four{grid-template-columns:repeat(4,minmax(0,1fr))}
  .toast{bottom:40px}
}
@media(min-width:1440px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .content{max-width:1420px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark" id="brandMark1"></span><span>学习目标管理台</span></div>
    <nav class="side-nav" id="navSide"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <div class="main-col">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" id="brandMark2"></span><span>学习目标管理台</span></div>
      <div class="spacer"></div>
      <nav class="top-nav" id="navTop"></nav>
      <div class="date-chip"><span id="dateIcon"></span><span id="dateText"></span></div>
    </header>
    <div id="bannerSlot"></div>
    <main class="content">
      <section class="panel" id="panel-today"></section>
      <section class="panel hidden" id="panel-board"></section>
      <section class="panel hidden" id="panel-week"></section>
      <section class="panel hidden" id="panel-me"></section>
    </main>
  </div>
  <nav class="tabbar" id="navBottom"></nav>
</div>
<div id="modalRoot"></div>
<div id="confettiRoot"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
"use strict";
/* ================= M1 数据层：存储 / 迁移 / 预置示例 ================= */
var STORE_KEY = "wb_goaldesk_v2";
var LEGACY_KEYS = ["wb_goaldesk_v1", "wb_goal_v1", "goalDeskData", "wb_goaldesk", "wb_goaldeck_v1"];
var PALETTE = ["#7c5cff", "#16a34a", "#0ea5e9", "#f59e0b", "#ec4899", "#14b8a6"];

function uid(p) {
  return (p || "id") + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function pad2(n) { return n < 10 ? "0" + n : "" + n; }
function todayStr() {
  var d = new Date();
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}
function fmtD(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function parseD(s) {
  var a = String(s || "").split("-");
  return new Date(Number(a[0]), Number(a[1]) - 1, Number(a[2]));
}
function addDays(s, n) {
  var d = parseD(s); d.setDate(d.getDate() + n); return fmtD(d);
}
/* b - a，单位天 */
function diffDays(a, b) {
  return Math.round((parseD(b).getTime() - parseD(a).getTime()) / 86400000);
}
/* 0=周一 … 6=周日 */
function dowMon(s) { return (parseD(s).getDay() + 6) % 7; }
/* 该日期所在周的周一 */
function weekStart(s) { return addDays(s, -dowMon(s)); }
function isDate(s) { return /^\d{4}-\d{2}-\d{2}$/.test(String(s || "")) && !isNaN(parseD(s).getTime()); }
function clampNum(v, def) { var n = Number(v); return isFinite(n) ? n : (def || 0); }

function emptyData() {
  return { version: 2, goals: [], records: [], weekly: {}, meta: { seeded: false, sampleCleared: false, bannerHiddenAt: 0, migratedFrom: null } };
}

/* 把任意来源（当前版本 / 旧版本 / 导入文件）的数据规整成 v2 结构 */
function normalizeData(raw) {
  var out = emptyData();
  if (!raw || typeof raw !== "object") return out;
  var goalsIn = Array.isArray(raw.goals) ? raw.goals : (Array.isArray(raw.targets) ? raw.targets : []);
  var recsIn = Array.isArray(raw.records) ? raw.records : (Array.isArray(raw.logs) ? raw.logs : (Array.isArray(raw.items) ? raw.items : []));
  var i, g, r;
  for (i = 0; i < goalsIn.length; i++) {
    g = goalsIn[i] || {};
    var start = isDate(g.startDate) ? g.startDate : (isDate(g.createdAt) ? g.createdAt.slice(0, 10) : (isDate(g.start) ? g.start : todayStr()));
    out.goals.push({
      id: g.id || uid("g"),
      name: String(g.name || g.title || "未命名目标"),
      unit: String(g.unit || g.u || "个"),
      total: Math.max(1, clampNum(g.total || g.target || g.amount, 100)),
      deadline: isDate(g.deadline) ? g.deadline : (isDate(g.due) ? g.due : addDays(todayStr(), 30)),
      color: /^#[0-9a-fA-F]{6}$/.test(g.color || "") ? g.color : PALETTE[i % PALETTE.length],
      obstacle: String(g.obstacle || g.blocker || ""),
      counter: String(g.counter || g.plan || g.ifThen || ""),
      tags: Array.isArray(g.tags) ? g.tags.slice(0, 4) : [],
      startDate: start,
      createdAt: g.createdAt || new Date().toISOString(),
      sample: !!g.sample
    });
  }
  var ids = {};
  for (i = 0; i < out.goals.length; i++) ids[out.goals[i].id] = 1;
  for (i = 0; i < recsIn.length; i++) {
    r = recsIn[i] || {};

  html += '<div class="sec-title">' + icon("target", 18) + "<span>今日</span><span class=\"sub\">" + mdLabel(todayStr()) + " 周" + WD.charAt(dowMon(todayStr())) + '</span><div class="spacer"></div>' +
    '<button class="btn sm primary" data-act="newGoal">' + icon("plus", 15) + "新建目标</button></div>";

  if (!goals.length) {
    html += '<div class="card empty">' + icon("empty", 34, 1.5) + "<div>还没有目标。</div>" +
      '<div class="tiny" style="margin-top:4px">先建一个有终点、有总量的目标，比如“背完 2000 个单词”。</div></div>';
    panel.innerHTML = html;
    return;
  }

  /* ---- 今天要处理 ---- */
  var sorted = goals.slice().sort(function (a, b) { return todayRank(a) - todayRank(b); });
  var box = '<div class="today-box"><div class="head">' + icon("alert", 18) + "<span>今天要处理</span>" +
    '<div class="spacer"></div><span class="tiny muted">共 ' + goals.length + " 个目标</span></div>";
  var any = false;
  for (var i = 0; i < sorted.length; i++) {
    var g = sorted[i], rank = todayRank(g);
    var ym = yesterdayMiss(g), od = overdueDays(g), done = isComplete(g);
    var sug = suggestToday(g);
    var cls = "n", title = "", desc = "", acts = "";
    if (done) {
      cls = "g";
      title = icon("check", 16) + "<span>" + esc(g.name) + " 已达成</span>";
      desc = "共完成 " + num(goalDone(g)) + " " + esc(g.unit) + "，可以考虑给自己一个奖励了。";
      acts = '<button class="btn sm ghost" data-act="checkinModal" data-id="' + g.id + '">继续记录</button>';
    } else if (rank === 0) {
      cls = "r";
      title = icon("alert", 16) + "<span>" + esc(g.name) + " · 昨天漏打卡，已滚入今日</span>";
      desc = "本周休息日已经用掉了，昨天是本周第 " + (ym ? ym.missCount : 2) + " 次漏打卡，连续天数已中断。昨天的量已经并进今天的建议里：<b>" + num(sug) + " " + esc(g.unit) + "</b>。";
      acts = '<button class="btn sm primary" data-act="checkinModal" data-id="' + g.id + '">立即打卡</button>' +
        '<button class="btn sm ghost" data-act="editGoal" data-id="' + g.id + '">调整计划</button>';
    } else if (rank === 1) {
      cls = "r";
      title = icon("alert", 16) + "<span>" + esc(g.name) + " · 已逾期 " + od + " 天</span>";
      desc = "截止日是 " + mdLabel(g.deadline) + "，还剩 <b>" + num(goalRemaining(g)) + " " + esc(g.unit) + "</b> 没做完。要么今天补一笔，要么把截止日调到一个你能做到的日子。";
      acts = '<button class="btn sm primary" data-act="checkinModal" data-id="' + g.id + '">立即打卡</button>' +
        '<button class="btn sm ghost" data-act="editGoal" data-id="' + g.id + '">调整计划</button>';
    } else if (rank === 2) {
      cls = "a";
      title = icon("moon", 16) + "<span>" + esc(g.name) + " · 昨天用掉本周休息日</span>";
      desc = "本周第一次漏打卡，自动记为休息日，连续天数没有中断（本周再漏一次才会断）。今天建议 <b>" + num(sug) + " " + esc(g.unit) + "</b>。";
      acts = '<button class="btn sm primary" data-act="checkinModal" data-id="' + g.id + '">立即打卡</button>';
    } else if (rank === 3) {
      cls = "a";
      title = icon("clock", 16) + "<span>" + esc(g.name) + " · 快到期了</span>";
      desc = "距截止还有 " + (daysLeftRaw(g) + 1) + " 天，还剩 " + num(goalRemaining(g)) + " " + esc(g.unit) + "，今天建议 <b>" + num(sug) + " " + esc(g.unit) + "</b>。";
      acts = '<button class="btn sm primary" data-act="checkinModal" data-id="' + g.id + '">立即打卡</button>';
    } else if (rank === 4) {
      cls = "n";
      title = icon("today", 16) + "<span>" + esc(g.name) + " · 今天还没打卡</span>";
      desc = "建议今天完成 <b>" + num(sug) + " " + esc(g.unit) + "</b>（剩余 " + num(goalRemaining(g)) + " ÷ 剩余 " + Math.max(1, daysLeftRaw(g) + 1) + " 天）。";
      acts = '<button class="btn sm primary" data-act="checkinModal" data-id="' + g.id + '">立即打卡</button>';
    } else {
      cls = "g";
      title = icon("check", 16) + "<span>" + esc(g.name) + " · 今天已打卡</span>";
      desc = "今日已记 " + num(dateSetOf(g.id)[todayStr()] || 0) + " " + esc(g.unit) + "，还想继续可以再记一笔。";
      acts = '<button class="btn sm ghost" data-act="checkinModal" data-id="' + g.id + '">再记一笔</button>';
    }
    box += '<div class="alert ' + cls + '"><div class="t">' + title + '</div><div class="d">' + desc + "</div>" +
      (g.counter ? '<div class="d" style="margin-top:6px;opacity:.85">你的预案：' + esc(g.counter) + "</div>" : "") +
      '<div class="acts">' + acts + "</div></div>";
    any = true;
  }
  if (!any) box += '<div class="empty">今天没有待处理的事项。</div>';
  box += "</div>";
  html += box;

  /* ---- 目标卡：可直接打卡 ---- */
  html += '<div class="sec-title">' + icon("board", 18) + "<span>目标卡</span><span class=\"sub\">直接改数字即可打卡</span></div>";
  html += '<div class="grid">';
  for (var k = 0; k < sorted.length; k++) {
    html += goalCardHTML(sorted[k]);
  }
  html += "</div>";

  /* ---- 底部再一个醒目入口 ---- */
  html += '<div style="margin:18px 0 6px"><button class="btn primary big block" data-act="newGoal">' + icon("plus", 18) + "再建一个目标</button></div>";
  html += '<p class="tiny muted" style="text-align:center;padding:2px 0 8px">只收有终点、有总量的目标；无限期的习惯打卡请用别的工具。</p>';

  panel.innerHTML = html;
}

function goalCardHTML(g) {
  var done = goalDone(g), rem = goalRemaining(g), pct = Math.min(100, Math.round(done / g.total * 1000) / 10);
  var sug = suggestToday(g), od = overdueDays(g), st = streakInfo(g), comp = isComplete(g);
  var todayAmt = dateSetOf(g.id)[todayStr()];
  var h = '<div class="card goal-card"><span class="bar" style="background:' + g.color + '"></span>';
  h += '<div class="goal-head"><div style="flex:1;min-width:0"><div class="goal-name">' + esc(g.name) + "</div><div class=\"goal-meta\">";
  h += '<span class="chip">' + icon("target", 12, 2) + num(done) + " / " + num(g.total) + " " + esc(g.unit) + "</span>";
  h += '<span class="chip' + (od > 0 && !comp ? " r" : "") + '">' + icon("clock", 12, 2) + (od > 0 && !comp ? "逾期 " + od + " 天" : "截止 " + mdShort(g.deadline)) + "</span>";
  if (todayAmt !== undefined) h += '<span class="chip g">' + icon("check", 12, 2) + "今日已记 " + num(todayAmt) + "</span>";
  for (var t = 0; t < g.tags.length; t++) h += '<span class="chip p">' + esc(g.tags[t]) + "</span>";
  h += "</div></div>";
  h += '<button class="iconbtn" data-act="editGoal" data-id="' + g.id + '" title="编辑">' + icon("edit", 16) + "</button>";
  h += '<button class="iconbtn d" data-act="delGoal" data-id="' + g.id + '" title="删除">' + icon("trash", 16) + "</button>";
  h += "</div>";

  if (g.obstacle || g.counter) {
    h += '<div class="plan">';
    if (g.obstacle) h += '<div><span class="k r">最容易挡住我的</span>：' + esc(g.obstacle) + "</div>";
    if (g.counter) h += '<div style="margin-top:3px"><span class="k">如果它出现，我就</span>：' + esc(g.counter) + "</div>";
    h += "</div>";
  }

  h += '<div class="prog"><div class="line"><div class="fill" style="width:' + pct + "%;background:" + (comp ? "var(--green)" : g.color) + '"></div></div>';
  h += '<div class="row tiny muted" style="margin-top:5px"><span>完成率 ' + pct + "%</span><div class=\"spacer\"></div><span>还剩 " + num(rem) + " " + esc(g.unit) + "</span></div></div>";

  h += '<div class="nums">';
  h += '<div class="n"><div class="v" style="color:' + (comp ? "var(--green)" : g.color) + '">' + (comp ? "已达成" : num(sug)) + '</div><div class="l">今日建议（' + esc(g.unit) + "）</div></div>";
  h += '<div class="n"><div class="v">' + st.days + '</div><div class="l">连续打卡（天）</div></div>';
  h += '<div class="n"><div class="v">' + (od > 0 && !comp ? '<span style="color:var(--red)">逾 ' + od + "</span>" : (daysLeftRaw(g) + 1)) + '</div><div class="l">' + (od > 0 && !comp ? "已逾期天数" : "剩余天数") + "</div></div>";
  h += "</div>";

  if (!comp) {
    h += '<div class="checkin">' +
      '<input class="amt" type="number" inputmode="decimal" step="any" min="0" value="' + sug + '" aria-label="本次数量">' +
      '<span class="tiny muted">' + esc(g.unit) + "</span>" +
      '<input class="min" type="number" inputmode="numeric" step="1" min="0" placeholder="分钟(选填)" aria-label="投入分钟">' +
      '<select class="dt">' + backfillOptions(todayStr()) + "</select>" +
      '<button class="btn primary sm" data-act="inlineCheckin" data-id="' + g.id + '">' + icon("check", 15) + "打卡</button></div>";
  } else {
    h += '<div class="alert g" style="margin-top:12px"><div class="t">' + icon("spark", 16) + "<span>目标已达成</span></div>" +
      '<div class="d">总投入 ' + num(done) + " " + esc(g.unit) + "，累计 " + recordsOf(g.id).length + " 条记录。</div></div>";
  }
  h += "</div>";
  return h;
}

function saveGoalFromForm() {
  var name = (document.getElementById("fName").value || "").trim();
  var unit = (document.getElementById("fUnit").value || "").trim() || "个";
  var total = Number(document.getElementById("fTotal").value);
  var deadline = document.getElementById("fDeadline").value;
  var obstacle = (document.getElementById("fObstacle").value || "").trim();
  var counter = (document.getElementById("fCounter").value || "").trim();
  if (!name) { toast("先给目标起个名字"); return; }
  if (!isFinite(total) || total <= 0) { toast("总量要填一个大于 0 的数字"); return; }
  if (!isDate(deadline)) { toast("请选择截止日"); return; }
  if (state.editingId) {
    var g = goalById(state.editingId);
    if (g) {
      g.name = name; g.unit = unit; g.total = total; g.deadline = deadline;
      g.color = state.formColor; g.obstacle = obstacle; g.counter = counter;
    }
    delete state.data.meta.draft;
    toast("已保存");
  } else {
    state.data.goals.push({
      id: uid("g"), name: name, unit: unit, total: total, deadline: deadline, color: state.formColor,
      obstacle: obstacle, counter: counter, tags: [], startDate: todayStr(),
      createdAt: new Date().toISOString(), sample: false
    });
    delete state.data.meta.draft;
    toast("目标已创建");
  }
  save();
  closeModal();
  refreshAll();
}

function askDeleteGoal(id) {
  var g = goalById(id);
  if (!g) return;
  confirmDialog("删除「" + esc(g.name) + "」？", "会同时删掉它的 <b>" + recordsOf(id).length + "</b> 条打卡记录，删除后无法恢复。", "确认删除", function () {
    state.data.goals = state.data.goals.filter(function (x) { return x.id !== id; });
    state.data.records = state.data.records.filter(function (r) { return r.goalId !== id; });
    save();
    closeModal();
    refreshAll();
    toast("已删除");
  }, true);
}

  );

function addRecord(goalId, date, amount, minutes) {
  var g = goalById(goalId);
  if (!g) return;
  amount = Number(amount);
  if (!isFinite(amount) || amount <= 0) { toast("数量要大于 0"); return; }
  var wasDone = isComplete(g);
  var mins = (minutes === "" || minutes === null || minutes === undefined || isNaN(Number(minutes))) ? null : Math.max(0, Math.round(Number(minutes)));
  state.data.records.push({
    id: uid("r"), goalId: goalId, date: date, amount: amount, minutes: mins,
    makeup: date !== todayStr(), createdAt: new Date().toISOString(), sample: false
  });
  save();
  var nowDone = isComplete(g);
  if (!wasDone && nowDone) {
    playConfetti();
    toast("目标达成！" + g.name);
  } else {
    toast("已记录 " + num(amount) + " " + g.unit + (date !== todayStr() ? "（补记 " + mdShort(date) + "）" : ""));
  }
}
/* ================= M5 看板：进度环 / 核心数字 / 记录 / 14 天堆叠柱图 ================= */
function ringHTML(pct, color, id) {
  var r = 42, c = 2 * Math.PI * r;
  var off = c * (1 - Math.max(0, Math.min(100, pct)) / 100);
  var gid = "rg_" + id;
  return '<svg viewBox="0 0 96 96" width="96" height="96">' +
    '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="1" y2="1">' +
    '<stop offset="0%" stop-color="' + color + '"/><stop offset="100%" stop-color="' + color + '" stop-opacity=".55"/></linearGradient></defs>' +
    '<circle cx="48" cy="48" r="' + r + '" fill="none" stroke="#eef0f7" stroke-width="9"/>' +
    '<circle cx="48" cy="48" r="' + r + '" fill="none" stroke="url(#' + gid + ')" stroke-width="9" stroke-linecap="round" ' +
    'stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '" transform="rotate(-90 48 48)"/>' +
    "</svg>";
}

function renderBoard() {
  var panel = document.getElementById("panel-board");

    return;

  html += '<div class="grid">';
  for (var i = 0; i < goals.length; i++) {
    var g = goals[i];
    var done = goalDone(g), rem = goalRemaining(g);
    var pct = Math.min(100, Math.round(done / g.total * 1000) / 10);
    var st = streakInfo(g), pj = projection(g), od = overdueDays(g), comp = isComplete(g);

    html += '<div class="goal-head"><div style="flex:1;min-width:0"><div class="goal-name">' + esc(g.name) + "</div>" +
      '<div class="goal-meta"><span class="chip">' + esc(g.unit) + "</span>" +

      "</div></div></div>";

    html += '<div class="ring-row" style="margin-top:12px"><div class="ring">' + ringHTML(pct, comp ? "#16a34a" : g.color, g.id) +

    html += '<div><div class="tiny muted">已完成 / 总量</div><div style="font-weight:800;font-size:15px">' + num(done) + " / " + num(g.total) + " " + esc(g.unit) +

    html += '<div style="margin-top:8px"><div class="tiny muted">连续打卡</div><div style="font-weight:800;font-size:15px">' + st.days + " 天" +

    if (comp) {
      html += '<div style="font-weight:800;font-size:15px;color:var(--green)">已达成</div>';
    } else if (!pj.ok) {
      html += '<div style="font-weight:800;font-size:15px;color:var(--muted)">暂无推算</div>' +

      html += '<div style="font-weight:800;font-size:15px">' + mdLabel(pj.date) + ' <span class="tiny muted">（约 ' + num(pj.avg) + " " + esc(g.unit) + "/天）</span></div>" +
        '<div style="margin-top:4px">' + tag + "</div>";
    }
    html += "</div></div></div>";

    if (g.obstacle || g.counter) {

          (r.makeup ? '<span class="chip a">补</span>' : "") +

}

function chartHTML() {
  var T = todayStr(), days = [], i, j;
  for (i = 13; i >= 0; i--) days.push(addDays(T, -i));
  var goals = state.data.goals;
  var mat = {}, maxV = 0, anyMinutes = false;
  for (i = 0; i < days.length; i++) mat[days[i]] = {};
  var rs = state.data.records;
  for (i = 0; i < rs.length; i++) {
    var r = rs[i];
    if (r.minutes === null || r.minutes === undefined) continue;
    if (mat[r.date] === undefined) continue;
    mat[r.date][r.goalId] = (mat[r.date][r.goalId] || 0) + (Number(r.minutes) || 0);
  }
  for (i = 0; i < days.length; i++) {
    var tot = 0;
    for (j = 0; j < goals.length; j++) tot += mat[days[i]][goals[j].id] || 0;
    if (tot > 0) anyMinutes = true;
    if (tot > maxV) maxV = tot;
  }
  if (!anyMinutes || maxV <= 0) {
    return '<div class="empty">' + icon("empty", 30, 1.5) + "<div>近 14 天还没有填过分钟数。</div>" +
      '<div class="tiny" style="margin-top:4px">打卡时「分钟」是选填项，没填的记录不会被凑数进这张图。</div></div>';
  }
  /* 纵轴刻度取整 */
  var step = maxV <= 30 ? 10 : (maxV <= 60 ? 20 : (maxV <= 150 ? 50 : (maxV <= 300 ? 100 : 200)));
  var top = Math.ceil(maxV / step) * step;
  var narrow = (typeof window !== "undefined" && window.innerWidth && window.innerWidth < 768);
  var W = narrow ? 380 : 680, H = narrow ? 210 : 250;
  var padL = 34, padR = 8, padT = 12, padB = 26;
  var plotW = W - padL - padR, plotH = H - padT - padB;
  var slot = plotW / days.length, bw = Math.min(26, slot * 0.6);
  var s = '<svg viewBox="0 0 ' + W + " " + H + '" width="100%" height="auto" style="display:block" font-family="inherit">';
  /* 网格与刻度 */
  var lines = top / step;
  for (i = 0; i <= lines; i++) {
    var v = step * i, y = padT + plotH - (v / top) * plotH;
    s += '<line x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + y.toFixed(1) + '" stroke="' + (i === 0 ? "#d8dceb" : "#eef0f7") + '" stroke-width="1"/>';
    s += '<text x="' + (padL - 6) + '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="end" font-size="10" fill="#6c7386">' + v + "</text>";
  }
  /* 柱体 */
  for (i = 0; i < days.length; i++) {
    var d = days[i], acc = 0;
    var x = padL + slot * i + (slot - bw) / 2;
    for (j = 0; j < goals.length; j++) {
      var v2 = mat[d][goals[j].id] || 0;
      if (v2 <= 0) continue;
      var h = (v2 / top) * plotH;
      var y2 = padT + plotH - acc - h;
      s += '<rect x="' + x.toFixed(1) + '" y="' + y2.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(1, h).toFixed(1) + '" rx="2" fill="' + goals[j].color + '" opacity=".92"><title>' + esc(mdShort(d) + " " + goals[j].name + " " + v2 + " 分钟") + "</title></rect>";
      acc += h;
    }
    if (acc > 0) {
      s += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (padT + plotH - acc - 4).toFixed(1) + '" text-anchor="middle" font-size="9" fill="#6c7386">' + Math.round(acc / plotH * top) + "</text>";
    }
    /* x 轴标签 */
    var lab = narrow ? String(Number(d.slice(8))) : mdShort(d);
    s += '<text x="' + (padL + slot * i + slot / 2).toFixed(1) + '" y="' + (H - 9) + '" text-anchor="middle" font-size="' + (narrow ? 9 : 10) + '" fill="' + (d === T ? "#7c5cff" : "#6c7386") + '" font-weight="' + (d === T ? "700" : "400") + '">' + lab + "</text>";
  }
  s += '<text x="' + padL + '" y="' + (padT - 2) + '" font-size="10" fill="#6c7386">分钟</text>';
  s += "</svg>";
  var lg = '<div class="chart-legend">';
  for (j = 0; j < goals.length; j++) lg += "<span><i style=\"background:" + goals[j].color + '\"></i>' + esc(goals[j].name) + "</span>";
  lg += '<span style="opacity:.7">未填分钟的记录不计入</span></div>';
  return s + lg;
}
/* ================= M6 周报：周汇总 / 环比 / 四栏复盘 / 生成文本 ================= */
function weekNote(range) {
  var k = range.key;
  if (!state.data.weekly[k]) state.data.weekly[k] = { keep: "", issue: "", tryIt: "", plan: "" };
  return state.data.weekly[k];
}
function deltaHTML(cur, prev, unit) {
  if (prev === 0 && cur === 0) return '<span class="delta flat">—</span>';
  var d = cur - prev;
  var pctTxt = prev > 0 ? "（" + (d >= 0 ? "+" : "") + Math.round(d / prev * 100) + "%）" : "（新增）";
  var cls = d > 0 ? "up" : (d < 0 ? "down" : "flat");
  var sign = d > 0 ? "+" : "";
  return '<span class="delta ' + cls + '">' + sign + num(d) + (unit ? " " + unit : "") + "<br>" + pctTxt + "</span>";
}
function deltaText(cur, prev, unit) {
  if (prev === 0 && cur === 0) return "与上周持平（都是 0）";
  var d = cur - prev;
  if (prev === 0) return "上周 0，本周 " + num(cur) + unit + "（新增）";
  var pct = Math.round(d / prev * 100);
  return "上周 " + num(prev) + unit + "，" + (d >= 0 ? "增加 " : "减少 ") + num(Math.abs(d)) + unit + "（" + (d >= 0 ? "+" : "-") + Math.abs(pct) + "%）";
}

    for (var i = 0; i < goals.length; i++) {

  html += '<div id="reportOut" class="report-out">点上面的按钮，生成包含环比与四栏内容的周报文本。</div>';

function fieldBlock(id, title, ph, val) {

}

function buildReportText() {
  var range = weekRange(state.weekOffset);
  var prevRange = weekRange(state.weekOffset - 1);
  var cur = weekStats(range), prev = weekStats(prevRange);
  var note = weekNote(range);
  var goals = state.data.goals;
  var L = [];
  L.push("学习周报 " + range.start + " ~ " + range.end);
  L.push("————————————");
  L.push("本周打卡 " + cur.dayCount + " 天，投入 " + cur.minutes + " 分钟，共 " + cur.records + " 条记录。");
  L.push("打卡天数：" + deltaText(cur.dayCount, prev.dayCount, " 天"));
  L.push("投入分钟：" + deltaText(cur.minutes, prev.minutes, " 分钟"));
  L.push("");
  L.push("【各目标进展】");
  if (!goals.length) L.push("（暂无目标）");
  for (var i = 0; i < goals.length; i++) {
    var g = goals[i];
    var c = cur.perGoal[g.id] || { amount: 0, minutes: 0, days: {} };
    var p = prev.perGoal[g.id] || { amount: 0, minutes: 0, days: {} };
    var cd = countDays(c.days), pd = countDays(p.days);
    var done = goalDone(g), pct = Math.min(100, Math.round(done / g.total * 1000) / 10);
    L.push("· " + g.name + "：" + num(c.amount) + " " + g.unit + "（" + deltaText(c.amount, p.amount, " " + g.unit) + "）；" +
      "打卡 " + cd + " 天（" + deltaText(cd, pd, " 天") + "）；" + (c.minutes || 0) + " 分钟（" + deltaText(c.minutes || 0, p.minutes || 0, " 分钟") + "）");
    L.push("  累计 " + num(done) + "/" + num(g.total) + " " + g.unit + "（" + pct + "%），截止 " + g.deadline +
      (overdueDays(g) > 0 && !isComplete(g) ? "，已逾期 " + overdueDays(g) + " 天" : ""));
  }
  L.push("");
  L.push("【复盘】");
  L.push("保持：" + (note.keep || "（未填写）"));
  L.push("问题：" + (note.issue || "（未填写）"));
  L.push("尝试：" + (note.tryIt || "（未填写）"));
  L.push("下周预案：" + (note.plan || "（未填写）"));
  return L.join("\n");
}

function exportJSON() {
  var payload = JSON.stringify(state.data, null, 2);
  var blob = new Blob([payload], { type: "application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "目标台备份-" + todayStr() + ".json";
  document.body.appendChild(a);
  a.click();
  setTimeout(function () {
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 300);
  state.data.meta.bannerHiddenAt = totalRecords();
  save();
  toast("已导出 JSON 备份");
  refreshAll();
}

function handleImportFile(file) {
  var reader = new FileReader();
  reader.onload = function () {
    var obj = null;
    try { obj = JSON.parse(String(reader.result)); } catch (e) { toast("这个文件不是有效的 JSON"); return; }
    var nd = normalizeData(obj);
    if (!nd.goals.length && !nd.records.length) { toast("文件里没有可导入的目标或记录"); return; }
    confirmDialog("导入将覆盖当前全部数据",
      "当前有 <b>" + state.data.goals.length + "</b> 个目标、<b>" + totalRecords() + "</b> 条记录；导入后会被替换成文件里的 <b>" +
      nd.goals.length + "</b> 个目标、<b>" + nd.records.length + "</b> 条记录。<br>建议先导出一份当前备份。",
      "覆盖导入", function () {
        state.data = nd;
        save();
        closeModal();
        refreshAll();
        toast("导入完成");
      }, true);
  };
  reader.readAsText(file);
}

function runMigrate() {
  var found = scanLegacy();
  if (!found.length) { toast("没有发现旧版本数据"); return; }
  var txt = [], addG = 0, addR = 0;
  for (var i = 0; i < found.length; i++) {
    txt.push("<b>" + found[i].key + "</b>：" + found[i].goals + " 个目标 / " + found[i].records + " 条记录");
    addG += found[i].goals; addR += found[i].records;
  }
  confirmDialog("迁移旧版本数据", "发现以下旧数据：<br>" + txt.join("<br>") + "<br>迁移会把它们合并进来（不会删掉你现在的数据）。", "合并进来", function () {
    var have = {}, haveR = {}, j;
    for (j = 0; j < state.data.goals.length; j++) have[state.data.goals[j].id] = 1;
    for (j = 0; j < state.data.records.length; j++) haveR[state.data.records[j].id] = 1;
    var gAdd = 0, rAdd = 0;
    for (var k = 0; k < found.length; k++) {
      var raw = null;
      try { raw = JSON.parse(localStorage.getItem(found[k].key)); } catch (e) { raw = null; }
      if (!raw) continue;
      var nd = normalizeData(raw);
      for (j = 0; j < nd.goals.length; j++) {
        if (have[nd.goals[j].id]) continue;
        have[nd.goals[j].id] = 1; state.data.goals.push(nd.goals[j]); gAdd++;
      }
      for (j = 0; j < nd.records.length; j++) {
        if (haveR[nd.records[j].id] || !have[nd.records[j].goalId]) continue;
        haveR[nd.records[j].id] = 1; state.data.records.push(nd.records[j]); rAdd++;
      }
      for (var wk in nd.weekly) if (nd.weekly.hasOwnProperty(wk) && !state.data.weekly[wk]) state.data.weekly[wk] = nd.weekly[wk];
    }
    state.data.meta.migratedFrom = found[0].key;
    save();
    closeModal();
    refreshAll();
    toast("已合并 " + gAdd + " 个目标 / " + rAdd + " 条记录");
  });
}

    meItem("trash", "a", "清空示例数据", "只删预置的 3 个示例目标及其记录", '<button class="btn sm ghost" data-act="clearSample">清空示例</button>') +
    '<div class="me-item" style="display:block;border-top:1px solid #f0f2f8;padding-top:12px">' +
    '<div class="row"><div class="ico r">' + icon("alert", 18) + '</div><div style="flex:1"><div class="ti">清空全部数据</div>' +
    '<div class="ds">删除所有目标、记录和周复盘，不可恢复。请在下面输入「清空」两个字后再点按钮。</div></div></div>' +
    '<div class="row" style="margin-top:10px;gap:8px"><input type="text" id="wipeInput" placeholder="在这里输入：清空" style="flex:1">' +
    '<button class="btn danger" data-act="wipeAll">确认清空</button></div></div>' +
    "</div>";

  html += '<p class="tiny muted" style="text-align:center;padding:14px 0 6px">单文件离线应用 · 无外部接口 · 所有内容都在这一个 HTML 里</p>';
  panel.innerHTML = html;
}
function meItem(ic, tone, title, desc, right) {
  return '<div class="me-item"><div class="ico ' + (tone === "p" ? "" : tone) + '">' + icon(ic, 18) + "</div>" +
    '<div style="flex:1;min-width:0"><div class="ti">' + title + '</div><div class="ds">' + desc + "</div></div>" + right + "</div>";
}
/* ================= M8 初始化与事件调度（唯一刷新入口） ================= */
function refreshAll() {
  renderBanner();
  renderToday();
  renderBoard();
  renderWeek();
  renderMe();
}

function syncSwatches() {
  var box = document.getElementById("fSwatches");
  if (!box) return;
  var btns = box.querySelectorAll(".swatch");
  for (var i = 0; i < btns.length; i++) {
    var on = btns[i].getAttribute("data-color") === state.formColor;
    btns[i].classList.toggle("on", on);
    btns[i].innerHTML = on ? icon("check", 16, 2.4) : "";
  }
}

function onClick(e) {
  var el = e.target.closest ? e.target.closest("[data-act],[data-tab]") : null;
  if (!el) return;
  var tab = el.getAttribute("data-tab");
  if (tab) { setTab(tab); return; }
  var act = el.getAttribute("data-act");
  var id = el.getAttribute("data-id");
  if (!act) return;

  if (act === "closeModal") { closeModal(); return; }
  if (act === "confirmOk") { var fn = state.pendingConfirm; if (fn) fn(); else closeModal(); return; }
  if (act === "newGoal") { goalFormModal(null); return; }
  if (act === "editGoal") { goalFormModal(id); return; }
  if (act === "saveGoal") { saveGoalFromForm(); return; }
  if (act === "delGoal") { askDeleteGoal(id); return; }
  if (act === "pickColor") { state.formColor = el.getAttribute("data-color"); syncSwatches(); return; }
  if (act === "checkinModal") { checkinModal(id); return; }
  if (act === "doCheckin") {
    var amt = document.getElementById("cAmt").value;
    var min = document.getElementById("cMin").value;
    var dt = document.getElementById("cDate").value;
    addRecord(id, dt, amt, min);
    closeModal();
    refreshAll();
    return;
  }
  if (act === "inlineCheckin") {
    var box = el.closest(".checkin");
    var a2 = box.querySelector(".amt").value;
    var m2 = box.querySelector(".min").value;
    var d2 = box.querySelector(".dt").value;
    addRecord(id, d2, a2, m2);
    refreshAll();
    return;
  }
  if (act === "delRec") {
    if (el.getAttribute("data-c") === "1") {
      state.data.records = state.data.records.filter(function (r) { return r.id !== id; });
      save(); refreshAll(); toast("已删除该记录");
    } else {
      el.setAttribute("data-c", "1");
      el.innerHTML = "确认";
      el.style.width = "auto"; el.style.padding = "0 8px"; el.style.fontSize = "12px"; el.style.fontWeight = "700";
      var btn = el;
      setTimeout(function () {
        if (btn.getAttribute("data-c") === "1") {
          btn.removeAttribute("data-c");
          btn.innerHTML = icon("trash", 15);
          btn.style.width = ""; btn.style.padding = ""; btn.style.fontSize = "";
        }
      }, 3000);
    }
    return;
  }
  if (act === "weekPrev") { state.weekOffset--; renderWeek(); return; }
  if (act === "weekNext") { if (state.weekOffset < 0) { state.weekOffset++; renderWeek(); } return; }
  if (act === "weekNow") { state.weekOffset = 0; renderWeek(); return; }
  if (act === "genReport") {
    document.getElementById("reportOut").textContent = buildReportText();
    toast("周报已生成");
    return;
  }
  if (act === "copyReport") {
    var txt = document.getElementById("reportOut").textContent || "";
    if (!txt || txt.indexOf("点上面的按钮") === 0) { toast("先点「一键生成周报文本」"); return; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function () { toast("已复制"); }, function () { fallbackCopy(txt); });
    } else { fallbackCopy(txt); }
    return;
  }
  if (act === "export") { exportJSON(); return; }
  if (act === "import") { document.getElementById("importFile").click(); return; }
  if (act === "migrate") { runMigrate(); return; }
  if (act === "clearSample") { clearSample(); return; }
  if (act === "hideBanner") {
    state.data.meta.bannerHiddenAt = totalRecords();
    save(); renderBanner();
    return;
  }
  if (act === "wipeAll") {
    var inp = document.getElementById("wipeInput");
    var v = inp ? String(inp.value || "").trim() : "";
    if (v !== "清空") { toast("请先在输入框里输入「清空」两个字"); return; }
    confirmDialog("清空全部数据", "所有目标、记录和周复盘都会被删除，无法恢复。确定继续吗？", "我确定，清空", function () {
      var fresh = emptyData();
      fresh.meta.seeded = true;
      fresh.meta.sampleCleared = true;
      state.data = fresh;
      state.weekOffset = 0;
      save(); closeModal(); refreshAll(); toast("已清空全部数据");
    }, true);
    return;
  }
}
function fallbackCopy(txt) {
  var ta = document.createElement("textarea");
  ta.value = txt;
  ta.style.position = "fixed"; ta.style.left = "-9999px";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); toast("已复制"); } catch (e) { toast("复制失败，请手动选中文本"); }
  document.body.removeChild(ta);
}

function onInput(e) {
  var t = e.target;
  var draft = t.getAttribute && t.getAttribute("data-draft");
  if (draft) { /* 新建目标表单：输入即时存草稿 */
    if (!state.data.meta.draft) state.data.meta.draft = {};
    state.data.meta.draft[draft] = t.value;
    state.data.meta.draft.color = state.formColor;
    save();
    return;
  }
  var note = t.getAttribute && t.getAttribute("data-note");
  if (!note) return; /* 周复盘输入：只写存储，不触发重渲染，避免光标丢失 */
  var n = weekNote(weekRange(state.weekOffset));
  if (note === "wKeep") n.keep = t.value;
  else if (note === "wIssue") n.issue = t.value;
  else if (note === "wTry") n.tryIt = t.value;
  else if (note === "wPlan") n.plan = t.value;
  save();
}

function init() {
  state.data = loadData();
  save();
  var mk = icon("target", 18, 2.2);
  var b1 = document.getElementById("brandMark1"), b2 = document.getElementById("brandMark2");
  if (b1) b1.innerHTML = mk;
  if (b2) b2.innerHTML = mk;
  var di = document.getElementById("dateIcon");
  if (di) di.innerHTML = icon("clock", 14, 2);
  var dtx = document.getElementById("dateText");
  if (dtx) dtx.textContent = todayStr() + " 周" + WD.charAt(dowMon(todayStr()));
  var sf = document.getElementById("sideFoot");
  if (sf) sf.innerHTML = "有终点、有总量的学习目标<br>数据存在本机浏览器<br>建议定期导出 JSON 备份";

  buildNav();
  setTab("today");
  refreshAll();

  document.addEventListener("click", onClick);
  document.addEventListener("input", onInput);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeModal();
  });
  document.getElementById("importFile").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0];
    if (f) handleImportFile(f);
    e.target.value = "";
  });
  var rt = null;
  window.addEventListener("resize", function () {
    if (state.tab !== "board") return;
    clearTimeout(rt);
    rt = setTimeout(function () { if (state.tab === "board") renderBoard(); }, 260);
  });
}

if (typeof window !== "undefined") {
  window.__desk = {
    state: state, init: init, refreshAll: refreshAll, loadData: loadData, seedData: seedData,
    streakInfo: streakInfo, projection: projection, yesterdayMiss: yesterdayMiss,
    suggestToday: suggestToday, weekStats: weekStats, weekRange: weekRange, goalDone: goalDone,
    addRecord: addRecord, goalById: goalById, isComplete: isComplete, buildReportText: buildReportText,
    chartHTML: chartHTML, backfillOptions: backfillOptions, todayRank: todayRank, recordsOf: recordsOf
  };
}
if (typeof document !== "undefined" && document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", init);
} else if (typeof document !== "undefined") {
  init();
}
</script>
